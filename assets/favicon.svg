<!-- The nav brand mark (.nav__mark) at favicon scale: the site's one accent
     colour on its own near-black, which stays legible at 16px where a
     wordmark would not. Colours are the :root tokens in css/style.css. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <rect width="32" height="32" rx="7" fill="#0A0A0A"/>
  <circle cx="16" cy="16" r="7" fill="#D9583C"/>
</svg>
